<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekranomat – Seraphexe</title>
    <link rel="stylesheet" href="ekranomat.css?v=7">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23141619'/%3E%3Cg fill='%23ffb000'%3E%3Crect x='2' y='2' width='5' height='5'/%3E%3Crect x='9' y='2' width='5' height='5'/%3E%3Crect x='2' y='9' width='5' height='5'/%3E%3Crect x='9' y='9' width='5' height='5'/%3E%3C/g%3E%3C/svg%3E">
</head>

<body>
    <p><a href="index.html">← Seraphexe</a></p>

    <h1>Ekranomat</h1>
    <p>Kalkulator ekranów LED: rozdzielczość, kable LAN i zasilające, przyłącze, waga.</p>

    <div class="zakladki" id="zakladki"></div>

    <p class="nazwa-wiersz">
        <label for="nazwa_sciany">Nazwa:</label>
        <input type="text" id="nazwa_sciany" placeholder="np. pasek nad stoiskiem">
        <button type="button" class="usun" id="usun_sciane" hidden>usuń ściankę</button>
    </p>

    <p class="nazwa-wiersz" id="polaczenie_blok" hidden>
        <label for="polaczona">Połączona z:</label>
        <select id="polaczona"></select>
        <select id="strona" aria-label="Strona">
            <option value="prawo">z prawej</option>
            <option value="lewo">z lewej</option>
            <option value="nad">nad</option>
            <option value="pod">pod</option>
        </select>
    </p>

    <div class="wymiary">
        <div class="wymiar-kolumna">
            <p class="wymiar-tytul">W metrach</p>
            <p>
                <label for="szerokosc_m">Szerokość:</label>
                <select id="szerokosc_m">
                    <option value="">– wybierz –</option>
                </select>
            </p>
            <p>
                <label for="wysokosc_m">Wysokość:</label>
                <select id="wysokosc_m">
                    <option value="">– wybierz –</option>
                </select>
            </p>
        </div>

        <div class="wymiar-kolumna">
            <p class="wymiar-tytul">W kabinetach</p>
            <p>
                <label for="kabinety_poziom">W poziomie:</label>
                <input type="number" inputmode="numeric" id="kabinety_poziom" min="1" step="1" placeholder="np. 10">
            </p>
            <p>
                <label for="kabinety_pion">W pionie:</label>
                <input type="number" inputmode="numeric" id="kabinety_pion" min="1" step="1" placeholder="np. 6">
            </p>
        </div>
    </div>

    <fieldset class="pitche">
        <legend>Pitch diody:</legend>
        <div class="kafelki">
            <label class="kafelek">
                <input type="radio" name="pitch" value="1.5">
                <span class="kafelek-tresc"><strong>P1.5</strong>320×320 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="1.9" checked>
                <span class="kafelek-tresc"><strong>P1.9</strong>256×256 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="2.6">
                <span class="kafelek-tresc"><strong>P2.6</strong>192×192 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="3.9">
                <span class="kafelek-tresc"><strong>P3.9</strong>128×128 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="inny">
                <span class="kafelek-tresc"><strong>Inny…</strong>wpisz własny</span>
            </label>
        </div>
    </fieldset>

    <p id="pitch_wlasny_blok" hidden>
        <label for="pitch_wlasny">Własny pitch (mm):</label>
        <input type="text" inputmode="decimal" id="pitch_wlasny" placeholder="np. 4,8">
    </p>

    <button id="oblicz">Oblicz</button>

    <div id="wynik"></div>

    <div id="podsumowanie"></div>



    <script src="script.js?v=28"></script>
</body>

</html>
