<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektromat – Seraphexe</title>
    <link rel="stylesheet" href="style.css?v=12">
</head>

<body>
    <p><a href="index.html">← Strona Główna</a></p>

    <h1>Elektromat</h1>
    <p>Kalkulator ekranów LED: rozdzielczość, kable LAN i zasilające, przyłącze, waga.</p>

    <div class="wymiary">
        <div class="wymiar-kolumna">
            <p class="wymiar-tytul">W metrach</p>
            <p>
                <label for="szerokosc_m">Szerokość:</label>
                <select id="szerokosc_m">
                    <option value="">– wybierz –</option>
                </select>
            </p>
            <p>
                <label for="wysokosc_m">Wysokość:</label>
                <select id="wysokosc_m">
                    <option value="">– wybierz –</option>
                </select>
            </p>
        </div>

        <div class="wymiar-kolumna">
            <p class="wymiar-tytul">W kabinetach</p>
            <p>
                <label for="kabinety_poziom">W poziomie:</label>
                <input type="number" inputmode="numeric" id="kabinety_poziom" min="1" step="1" placeholder="np. 10">
            </p>
            <p>
                <label for="kabinety_pion">W pionie:</label>
                <input type="number" inputmode="numeric" id="kabinety_pion" min="1" step="1" placeholder="np. 6">
            </p>
        </div>
    </div>

    <fieldset class="pitche">
        <legend>Pitch diody:</legend>
        <div class="kafelki">
            <label class="kafelek">
                <input type="radio" name="pitch" value="1.5" checked>
                <span class="kafelek-tresc"><strong>P1.5</strong>320×320 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="1.9">
                <span class="kafelek-tresc"><strong>P1.9</strong>256×256 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="2.6">
                <span class="kafelek-tresc"><strong>P2.6</strong>192×192 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="3.9">
                <span class="kafelek-tresc"><strong>P3.9</strong>128×128 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="inny">
                <span class="kafelek-tresc"><strong>Inny…</strong>wpisz własny</span>
            </label>
        </div>
    </fieldset>

    <p id="pitch_wlasny_blok" hidden>
        <label for="pitch_wlasny">Własny pitch (mm):</label>
        <input type="text" inputmode="decimal" id="pitch_wlasny" placeholder="np. 4,8">
    </p>

    <button id="oblicz">Oblicz</button>

    <div id="wynik"></div>



    <script src="script.js?v=19"></script>
</body>

</html>
