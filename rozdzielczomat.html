<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rozdzielczomat – Seraphexe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p><a href="index.html">← Strona Główna</a></p>

    <h1>Rozdzielczomat</h1>
    <p>Kalkulator liczący kabinety i rozdzielczość ekranu</p>

    <p>
        <label for="szerokosc_m">Szerokość ekranu:</label>
        <select id="szerokosc_m">
            <option value="">– wybierz –</option>
        </select>
    </p>

    <p>
        <label for="wysokosc_m">Wysokość ekranu:</label>
        <select id="wysokosc_m">
            <option value="">– wybierz –</option>
        </select>
    </p>

    <fieldset class="pitche">
        <legend>Pitch diody:</legend>
        <div class="kafelki">
            <label class="kafelek">
                <input type="radio" name="pitch" value="1.5" checked>
                <span class="kafelek-tresc"><strong>P1.5</strong>320×320 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="1.9">
                <span class="kafelek-tresc"><strong>P1.9</strong>256×256 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="2.6">
                <span class="kafelek-tresc"><strong>P2.6</strong>192×192 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="3.9">
                <span class="kafelek-tresc"><strong>P3.9</strong>128×128 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="inny">
                <span class="kafelek-tresc"><strong>Inny…</strong>wpisz własny</span>
            </label>
        </div>
    </fieldset>

    <p id="pitch_wlasny_blok" hidden>
        <label for="pitch_wlasny">Własny pitch (mm):</label>
        <input type="text" inputmode="decimal" id="pitch_wlasny" placeholder="np. 4,8">
    </p>

    <button id="oblicz">Oblicz</button>

    <div id="wynik"></div>

    <script src="script.js"></script>
</body>

</html>
