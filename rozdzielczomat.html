    <h1>Rozdzielczomat</h1>
    <p>Kalkulator liczący kabinety i rozdzielczość ekranu</p>

    <p>
        <label for="szerokosc_m">Szerokość ekranu (m):</label>
        <input type="text" inputmode="decimal" id="szerokosc_m" placeholder="np. 1 / 1,5 / 2">
    </p>

    <p>
        <label for="wysokosc_m">Wysokość ekranu (m):</label>
        <input type="text" inputmode="decimal" id="wysokosc_m" placeholder="np. 1 / 1,5 / 2">
    </p>

    <fieldset class="pitche">
        <legend>Pitch diody:</legend>
        <div class="kafelki">
            <label class="kafelek">
                <input type="radio" name="pitch" value="1.5" checked>
                <span class="kafelek-tresc"><strong>P1.5</strong>Indoor, fine-pitch<br>320×320 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="1.9">
                <span class="kafelek-tresc"><strong>P1.9</strong>Indoor<br>256×256 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="2.6">
                <span class="kafelek-tresc"><strong>P2.6</strong>Uniwersalny<br>192×192 px</span>
            </label>
            <label class="kafelek">
                <input type="radio" name="pitch" value="3.9">
                <span class="kafelek-tresc"><strong>P3.9</strong>Rental / scena<br>128×128 px</span>
            </label>
