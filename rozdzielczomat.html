<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rozdzielczomat – Seraphexe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p><a href="index.html">← Strona Główna</a></p>

    <h1>Rozdzielczomat</h1>
    <p>Kalkulator liczący kabinety i rozdzielczość ekranu</p>

    <p>
        <label for="szerokosc_m">Szerokość ekranu (m):</label>
        <input type="number" id="szerokosc_m" step="any">
    </p>

    <p>
        <label for="wysokosc_m">Wysokość ekranu (m):</label>
        <input type="number" id="wysokosc_m" step="any">
    </p>

    <p>
        <label for="pitch_wybor">Pitch diody:</label>
        <select id="pitch_wybor">
            <option value="1.9">1.9 mm</option>
            <option value="2.5">2.5 mm</option>
            <option value="2.6">2.6 mm</option>
            <option value="2.9">2.9 mm</option>
            <option value="inny">Inny…</option>
        </select>
    </p>

    <p id="pitch_wlasny_blok" hidden>
        <label for="pitch">Własny pitch (mm):</label>
        <input type="number" id="pitch" step="any">
    </p>

    <button id="oblicz">Oblicz</button>

    <div id="wynik"></div>

    <script src="script.js"></script>
</body>

</html>
